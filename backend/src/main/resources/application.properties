# ============================================================
# AlgoArena Backend — Application Properties (Development)
# ============================================================

# ------------------------------------------------------------
# Secrets / environment-specific values are NEVER given defaults here.
# DB_URL, DB_USERNAME, DB_PASSWORD and JWT_SECRET must come from the environment
# (or, for local development only, from an untracked backend/.env file - see .env.example).
# The app refuses to start if one is missing or if JWT_SECRET is weak/known.
# ------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${PORT:8080}
# Behind Render/Vercel-style reverse proxies Tomcat replaces the proxy address with the real client
# address (only for TRUSTED proxies, default: private ranges) - used by the auth rate limiter.
server.forward-headers-strategy=native

# ============================================================
# DSA Competition (separate mode; OFF unless explicitly enabled)
# Enable ONLY after db/competition/001_create_competition_tables.sql has been applied to the database.
# ============================================================
competition.enabled=${COMPETITION_ENABLED:false}
competition.min-players=${COMPETITION_MIN_PLAYERS:2}
competition.max-players=${COMPETITION_MAX_PLAYERS:25}
competition.question-count=${COMPETITION_QUESTION_COUNT:10}
competition.duration-seconds=${COMPETITION_DURATION_SECONDS:1200}
competition.countdown-seconds=${COMPETITION_COUNTDOWN_SECONDS:10}
competition.lobby-ttl-seconds=${COMPETITION_LOBBY_TTL_SECONDS:600}
competition.disconnect-grace-seconds=${COMPETITION_DISCONNECT_GRACE_SECONDS:30}

# Authentication rate limiting (in-memory, single instance). Defaults live in AuthRateLimiter;
# override with security.rate-limit.* properties or set security.rate-limit.enabled=false for local load tests.

# ============================================================
# DataSource — Neon PostgreSQL
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP) — Optimized for Neon Serverless Pooler
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=30000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ============================================================
# CORS
# ============================================================
# Trusted browser origins, comma separated, EXACT origins only (no wildcards - startup fails otherwise).
# The defaults below are for local development only. In every deployed environment set
# CORS_ALLOWED_ORIGINS to the real frontend origin(s), e.g. https://your-app.vercel.app
# (app.frontend-url / FRONTEND_URL is always trusted in addition).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
# Logging
# ============================================================
logging.level.com.algoarena=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=INFO

# ============================================================
# Brevo REST API & App URL
# ============================================================
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:no-reply@algoarena.com}
brevo.sender.name=${BREVO_SENDER_NAME:AlgoArena}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Local development only: log the password-reset link when no email provider is configured.
# Never enable in a deployed environment (the link contains the reset token).
app.dev-log-reset-links=${DEV_LOG_RESET_LINKS:false}
