# ============================================================
# MindMaze Backend — Application Properties (Development)
# ============================================================

# Server
server.port=${PORT:8080}

# ============================================================
# DataSource — Neon PostgreSQL
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-tiny-cell-ayjc5n7d-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_Dc0ej4mHaPEs}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP) — Optimized for Neon Serverless Pooler
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=30000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET:mindmaze-super-secret-key-change-in-production-at-least-64-chars-long-2024}
jwt.expiration=86400000

# ============================================================
# CORS
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*,.vercel.app,.onrender.com}

# ============================================================
# Logging
# ============================================================
logging.level.com.mindmaze=DEBUG
logging.level.org.springframework.security=INFO

# ============================================================
# Brevo REST API & App URL
# ============================================================
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:no-reply@algoarena.com}
brevo.sender.name=${BREVO_SENDER_NAME:AlgoArena}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

