<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — AlgoArena</title>
  <style>
    :root {
      --bg: #0B0B0B;
      --surface: #171717;
      --surface-elevated: #1E1E1E;
      --accent: #C5F467;
      --ink: #F2F2F2;
      --ink-muted: #929292;
      --border: #292929;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(197, 244, 103, 0.05) 0%, transparent 60%),
        radial-gradient(circle, rgba(197, 244, 103, 0.08) 0.8px, transparent 0.8px);
      background-size: 100% 100%, 28px 28px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 36px -8px rgba(0, 0, 0, 0.6);
    }
    .icon-wrap {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: rgba(197, 244, 103, 0.12);
      border: 1px solid rgba(197, 244, 103, 0.3);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      color: var(--ink-muted);
      font-size: 0.875rem;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 42px;
      background: var(--accent);
      color: #0B0B0B;
      font-weight: 650;
      font-size: 0.875rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .retry-btn:hover {
      opacity: 0.92;
    }
    .retry-btn:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-wrap">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="badge">Connection Offline</div>
    <h1>Network Disconnected</h1>
    <p>AlgoArena could not reach the servers. Please check your internet connection to access real-time challenges and rated matches.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      Reconnect to Arena
    </button>
  </div>
</body>
</html>
